name: Deploy AuditTool

# Minor documentation comment: main branch push triggers deployment on self-hosted runner.

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted]

    steps:
      - name: Run deployment script
        shell: powershell
        run: |
          powershell.exe -ExecutionPolicy Bypass -File "C:\DeployScripts\deploy-audits-tool-qa.ps1"