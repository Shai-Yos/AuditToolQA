name: Deploy AuditTool

on:
  # No-op update to trigger a new commit/push when needed.
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted]

    steps:
      - name: Run deployment script
        shell: powershell
        run: |
          powershell.exe -ExecutionPolicy Bypass -File "C:\DeployScripts\deploy-audits-tool-qa.ps1"